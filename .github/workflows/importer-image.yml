# Runs the importer's tests, then builds its image and publishes it to GitHub's container registry.
# jeff (live) is tagged :latest, dev (testing) is tagged :dev. Both also get :sha-<commit>.
name: Build importer image

on:
  push:
    branches: [jeff, dev]
    paths:
      - "importer/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: importer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q   # tests that need the private DROPS fixtures skip themselves

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Choose the image tag from the branch
        id: tag
        run: |
          case "$GITHUB_REF_NAME" in
            jeff) echo "name=latest" >> "$GITHUB_OUTPUT" ;;
            dev)  echo "name=dev" >> "$GITHUB_OUTPUT" ;;
            *)    echo "Only the jeff and dev branches build images, not $GITHUB_REF_NAME."; exit 1 ;;
          esac
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build into the runner first, check that Chromium and poppler work inside it, and only then publish.
      - uses: docker/build-push-action@v7
        with:
          context: importer
          platforms: linux/amd64
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/knit-import:${{ steps.tag.outputs.name }}
            ghcr.io/${{ github.repository_owner }}/knit-import:sha-${{ github.sha }}
      - name: Self-check inside the image (Chromium prints a PDF, poppler reads it)
        run: docker run --rm --shm-size=256m ghcr.io/${{ github.repository_owner }}/knit-import:sha-${{ github.sha }} python -m app.selfcheck
      - name: Publish
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/knit-import:sha-${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/knit-import:${{ steps.tag.outputs.name }}
