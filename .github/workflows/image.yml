# Builds the patched Knitting Library image and publishes it to GitHub's container registry.
# jeff (live) is tagged :jeff, dev (testing) is tagged :dev. Both also get :sha-<commit>.
name: Build Knitting Library image

on:
  push:
    branches: [jeff, dev]
    paths-ignore:
      - "importer/**"
      - "deploy/**"
      - "*.md"
      - ".github/workflows/importer-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Choose the image tag from the branch
        id: tag
        run: |
          case "$GITHUB_REF_NAME" in
            jeff) echo "name=jeff" >> "$GITHUB_OUTPUT" ;;
            dev)  echo "name=dev" >> "$GITHUB_OUTPUT" ;;
            *)    echo "Only the jeff and dev branches build images, not $GITHUB_REF_NAME."; exit 1 ;;
          esac
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build into the runner first, start it and try the basics, and only then publish.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/knitting-library:${{ steps.tag.outputs.name }}
            ghcr.io/${{ github.repository_owner }}/knitting-library:sha-${{ github.sha }}
      - name: Smoke test (sign-in, PDF upload, page pictures)
        run: |
          docker run -d --name kl-smoke -p 18080:8080 ghcr.io/${{ github.repository_owner }}/knitting-library:sha-${{ github.sha }}
          python3 .github/scripts/kl-smoke.py http://127.0.0.1:18080 || { docker logs kl-smoke; exit 1; }
          docker rm -f kl-smoke
      - name: Publish
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/knitting-library:sha-${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/knitting-library:${{ steps.tag.outputs.name }}
