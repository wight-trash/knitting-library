# Builds the patched Knitting Library image and publishes it to GitHub's container registry.
# jeff (live) is tagged :jeff, dev (testing) is tagged :dev. Both also get :sha-<commit>.
name: Build Knitting Library image

on:
  push:
    branches: [jeff, dev]
    paths-ignore:
      - "importer/**"
      - "deploy/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Choose the image tag from the branch
        id: tag
        run: |
          case "$GITHUB_REF_NAME" in
            jeff) echo "name=jeff" >> "$GITHUB_OUTPUT" ;;
            dev)  echo "name=dev" >> "$GITHUB_OUTPUT" ;;
            *)    echo "Only the jeff and dev branches build images, not $GITHUB_REF_NAME."; exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/knitting-library:${{ steps.tag.outputs.name }}
            ghcr.io/${{ github.repository_owner }}/knitting-library:sha-${{ github.sha }}
