# Monthly update pull requests for the importer's packages and base image and for workflow actions, aimed at dev.
# The library's own packages follow upstream (FORK.md, "Package updates"), so they are not listed here.
# Dependabot reads this file from the repository's default branch, which is jeff.
#
# Minor and patch updates are grouped into one pull request per folder; major versions come one by one.
# Each pull request runs the tests and image checks (results show on the pull request). Merge the green ones
# into dev, try the dev stack, then promote to jeff.
version: 2

updates:
  - package-ecosystem: pip
    directory: /importer
    target-branch: dev
    schedule: { interval: monthly }
    groups:
      importer-minor: { update-types: [minor, patch] }

  - package-ecosystem: docker
    directory: /importer
    target-branch: dev
    schedule: { interval: monthly }

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: monthly }
